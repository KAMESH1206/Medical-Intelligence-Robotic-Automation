name: MIRA Ops CI/CD Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # 1. Frontend Test & Build (Next.js 16)
    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Frontend Dependencies
      run: npm ci

    - name: TypeScript Compile & Build
      run: npm run build
      env:
        ANTHROPIC_API_KEY: "mock_key_for_ci_build"

    # 2. Python Backend Integration Tests (Python 3.12)
    - name: Setup Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Backend Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Run Backend Seed & Verification
      run: |
        cd backend
        python seed.py

    - name: Execute API Unit & Integration Tests
      run: |
        cd backend
        python tests/test_api.py
